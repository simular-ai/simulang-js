version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    versioning-strategy: 'increase'
    groups:
      napi-rs:
        patterns:
          - '@napi-rs/*'
          - '@emnapi/*'
          - 'napi*'
      linter:
        patterns:
          - 'oxlint'
          - 'prettier'
          - 'typescript'
          - '@types/node'

  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
    cooldown:
      default-days: 7
      # simulang-rs is pinned to a git tag and bumped manually on every release,
      # usually within the cooldown window. Dependabot then targets the newest
      # tag *outside* the cooldown, which is older than the pin, and opens
      # downgrade PRs (e.g. #145, #153). Excluding it avoids the mismatch.
      exclude:
        - 'simulang-rs'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
