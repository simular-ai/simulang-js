name: CI

env:
  DEBUG: napi:*
  APP_NAME: simulang-js
  # Oldest macOS the addon supports.
  MACOSX_DEPLOYMENT_TARGET: '10.15'

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths-ignore:
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
  pull_request: null
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/.gitconfig-blank # Create a blank gitconfig file in the temp directory. Ensures local gitconfig is not used.
      - name: Fetch github.com SSH host keys
        id: keyscan
        shell: bash
        run: |
          {
            echo 'known-hosts<<EOF'
            ssh-keyscan github.com
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        env:
          # The action writes ssh-key to a file, but cargo's built-in git fetch
          # only supports ssh-agent auth, so the private simulang-rs clone needs
          # the git CLI.
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        with:
          rust-version: stable
          ssh-key: ${{ secrets.SIMULIB_RS_SSH_KEY }}
          ssh-known-hosts: ${{ steps.keyscan.outputs.known-hosts }}

  # On tag pushes we build every target so the publish job has full platform coverage.
  # On every other run we only build the two primary targets to save CI time.
  # `checks` runs the lints and the typecheck. No code is gated on the CPU
  # architecture, so they give the same result for every architecture of an
  # OS, and one target per OS runs them. Every target tests its own binary.
  targets:
    name: Pick build targets
    runs-on: ubuntu-latest
    outputs:
      settings: ${{ steps.pick.outputs.settings }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            cat <<'EOF' >> "$GITHUB_OUTPUT"
          settings<<JSON
          [
            {"host": "windows-latest",   "target": "x86_64-pc-windows-msvc",    "checks": true},
            {"host": "windows-11-arm",   "target": "aarch64-pc-windows-msvc",   "checks": false},
            {"host": "macos-latest",     "target": "aarch64-apple-darwin",      "checks": true},
            {"host": "macos-15-intel",   "target": "x86_64-apple-darwin",       "checks": false},
            {"host": "ubuntu-latest",    "target": "x86_64-unknown-linux-gnu",  "checks": true},
            {"host": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "checks": false}
          ]
          JSON
          EOF
          else
            cat <<'EOF' >> "$GITHUB_OUTPUT"
          settings<<JSON
          [
            {"host": "windows-latest", "target": "x86_64-pc-windows-msvc",   "checks": true},
            {"host": "macos-latest",   "target": "aarch64-apple-darwin",     "checks": true},
            {"host": "ubuntu-latest",  "target": "x86_64-unknown-linux-gnu", "checks": true}
          ]
          JSON
          EOF
          fi

  build:
    name: Build ${{ matrix.settings.target }}
    needs: targets
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.targets.outputs.settings) }}

    steps:
      # Setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/.gitconfig-blank # Create a blank gitconfig file in the temp directory. Ensures local gitconfig is not used.

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Configure SSH for private deps (simulang-rs)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SIMULIB_RS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf "Host github.com\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n" >> ~/.ssh/config
        shell: bash
      # Ubuntu's mirror sometimes serves packages at 30–70 kB/s, which made
      # installs take up to 8 min. Keep the downloaded .debs in the Actions
      # cache, keyed on the exact files apt picks, so new package versions
      # refresh it. apt checks each cached .deb against the signed package
      # index, so release tags can use the cache too.
      - name: Find the Linux packages to download
        id: apt
        if: runner.os == 'Linux'
        shell: bash
        # Native deps pulled in transitively through simulang-rs:
        #   libasound2-dev    -> cpal / rodio (ALSA)
        #   libxdo-dev        -> enigo (xdotool)
        #   libxkbcommon-dev  -> enigo (keymap handling)
        #   libxi-dev         -> X11 input extension (enigo)
        #   libxtst-dev       -> X11 test extension (enigo)
        # Test-time dep:
        #   xvfb              -> headless X server for clipboard/screen/screenshot tests
        # apt-get update first: the runner image's baked-in package lists go
        # stale, and installs 404 once the archive drops the listed version.
        run: |
          packages="libasound2-dev libxdo-dev libxkbcommon-dev libxi-dev libxtst-dev xvfb"
          sudo apt-get update
          mkdir -p ~/apt-archives/partial
          debs="$(sudo apt-get install --print-uris -qq -o Dir::Cache::Archives="$HOME/apt-archives" $packages | cut -d' ' -f2 | sort)"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-$ImageOS-$RUNNER_ARCH-" >> "$GITHUB_OUTPUT"
          echo "debs=$(sha256sum <<< "$debs" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache Linux packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt.outputs.prefix }}${{ steps.apt.outputs.debs }}
          restore-keys: ${{ steps.apt.outputs.prefix }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archives=(-o Dir::Cache::Archives="$HOME/apt-archives")
          sudo apt-get install -y "${archives[@]}" ${{ steps.apt.outputs.packages }}
          # Drop .debs of superseded versions, so the cache doesn't grow.
          sudo apt-get autoclean "${archives[@]}"
      - name: Install
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # Dependency builds depend on the compiler, the lockfile and CARGO_*/RUST*
      # settings, so the key covers all of them. A changed lockfile, such as a
      # simulang-rs bump, restores the newest cache with the same compiler and
      # settings, and a new compiler starts over, dropping outdated dependencies.
      # Release tags build from scratch: compiled output in target/ is not
      # verified like downloaded crates are, and an addon we publish should
      # contain nothing another run left there.
      - name: Compute cargo cache key
        id: cargo-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          toolchain="$({ rustc -vV; env | grep -E '^(CARGO|RUST)' | sort; } | sha256sum | cut -c1-16)"
          prefix="cargo-${{ matrix.settings.target }}-$toolchain-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${{ hashFiles('Cargo.lock', 'Cargo.toml') }}" >> "$GITHUB_OUTPUT"
          # One list for both steps below: restore and save must name the same paths.
          cat >> "$GITHUB_OUTPUT" <<'EOF'
          paths<<PATHS
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
          PATHS
          EOF
      # Only main saves, so pull requests don't push main's caches out of the
      # repository's 10 GB. actions/cache saves in a post step when the job ends.
      - name: Restore cargo cache, and save it when the job ends
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cargo-cache.outputs.paths }}
          key: ${{ steps.cargo-cache.outputs.key }}
          restore-keys: ${{ steps.cargo-cache.outputs.prefix }}
      - name: Restore cargo cache
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cargo-cache.outputs.paths }}
          key: ${{ steps.cargo-cache.outputs.key }}
          restore-keys: ${{ steps.cargo-cache.outputs.prefix }}
      - name: Install dependencies
        run: npm ci

      # Lint
      - name: Oxlint
        if: matrix.settings.checks
        run: npm run lint -- --deny-warnings
      - name: Cargo fmt
        if: matrix.settings.checks
        run: cargo fmt -- --check
      - name: Clippy
        if: matrix.settings.checks
        run: cargo clippy

      # Build
      - name: Build (path-remapped)
        shell: bash
        run: |
          # .cargo/ci-rustflags.toml, not RUSTFLAGS: RUSTFLAGS replaces +crt-static.
          # Windows target tables replace [build] rustflags, so the remap is repeated there.
          remap() {
            [[ "$RUNNER_OS" == "Windows" ]] && cygpath -w "$1" || printf '%s' "$1"
          }
          toml_escape() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }
          cargo="$(toml_escape "$(remap "${CARGO_HOME:-$HOME/.cargo}")")"
          workspace="$(toml_escape "$(remap "$GITHUB_WORKSPACE")")"
          flags="\"--remap-path-prefix=${cargo}=/cargo\", \"--remap-path-prefix=${workspace}=/workspace\""
          cat > .cargo/ci-rustflags.toml <<EOF
          [build]
          rustflags = [${flags}]

          [target.x86_64-pc-windows-msvc]
          rustflags = [${flags}]

          [target.aarch64-pc-windows-msvc]
          rustflags = [${flags}]
          EOF
          # Release tags publish this build, so they use the slow dist profile.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npm run build:dist
          else
            npm run build
          fi

      - name: Strip release symbols (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Belt-and-suspenders: Cargo's `strip = true` is supposed to
          # remove non-global symbols but has historically left them in
          # place for napi cdylib builds.
          shopt -s nullglob
          for f in "${APP_NAME}".*.node; do
            echo "Stripping $f"
            strip -x "$f"
          done

      - name: Check weak linking (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # simulang-rs weak-links these, because older macOS lacks them or some
          # of their functions. A strong link stops the addon loading there.
          shopt -s nullglob
          nodes=("${APP_NAME}".*.node)
          [[ ${#nodes[@]} -gt 0 ]] || { echo "::error::No .node file to check"; exit 1; }
          for f in "${nodes[@]}"; do
            weak="$(otool -l "$f" | grep -A2 LC_LOAD_WEAK_DYLIB || true)"
            for framework in ScreenCaptureKit UniformTypeIdentifiers CoreAudio; do
              [[ "$weak" == *"/$framework.framework/"* ]] || { echo "::error::$f doesn't link $framework weakly"; exit 1; }
              echo "$f links $framework weakly"
            done
          done

      # Typecheck
      - name: Typecheck
        if: matrix.settings.checks
        run: npm run typecheck

      # Test
      - name: Test bindings
        shell: bash
        run: |
          # Linux runners are headless, but clipboard/screen/screenshot tests
          # need an X server. Wrap with xvfb-run so $DISPLAY is set and the X11
          # backends in arboard / xcap can connect.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm test
          else
            npm test
          fi

      # Upload Artifacts (only needed for publish, which runs on tags)
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error

      # Documentation - generate the TypeDoc HTML site from the freshly
      # rebuilt index.d.ts and upload it as a Pages artifact
      - name: Generate docs
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        run: npm run docs
      - name: Upload Pages artifact
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  # Deploys the Pages artifact uploaded by the Linux x86_64 build above.
  deploy-docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write # required to mirror to GitHub Packages
      id-token: write # required for npm trusted publishing (OIDC) to npmjs.org
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/.gitconfig-blank # Create a blank gitconfig file in the temp directory. Ensures local gitconfig is not used.

      # Scan the release tree before anything is published: an npmjs publish
      # can't be taken back, and the public mirror below copies this tree.
      # Every release tag, pre-releases included, since they reach npm too.
      # gitleaks goes to the runner's temp dir, outside the package directory.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

      - name: Scan release tree for secrets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release-tree"
          # --verbose names each finding's rule, file and line; --redact hides the match.
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/release-tree" --redact --verbose --exit-code 1 --no-banner

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Intentionally no `registry-url`: setup-node would otherwise inject
          # NODE_AUTH_TOKEN handling into ~/.npmrc, which conflicts with the
          # OIDC-based trusted publish to npmjs.org and causes 404s. The
          # GitHub Packages publish writes its own auth line and the npmjs
          # publish wipes ~/.npmrc beforehand (see "Publish" step below).
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: create npm dirs
        run: npx napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Move artifacts
        run: npm run artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # used for the GitHub Packages publish below
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # napi prepublish reads this when creating the GitHub release
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_NAME#v}"
          if echo "$TAG_VERSION" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$"; then
            DIST_TAG="latest"
          elif echo "$TAG_VERSION" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+-.+"; then
            DIST_TAG="next"
          else
            echo "Not a release, skipping publish"
            exit 0
          fi

          # 1. Publish to GitHub Packages first. It's org-private, so a
          #    broken release here is easy to delete and retry, whereas an
          #    npmjs publish is immutable (you can only deprecate, not
          #    delete, after 72h).
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com/ --access restricted --tag "$DIST_TAG"

          # 2. Publish to npmjs.org via OIDC trusted publishing.
          #    The npm CLI picks up the GitHub Actions OIDC token automatically
          #    when `id-token: write` is granted to the job (see permissions
          #    block above) and the package is configured for trusted
          #    publishing on npmjs.org. Wipe ~/.npmrc first so the GitHub
          #    Packages auth line from step 1 doesn't shadow the OIDC token.
          rm -f ~/.npmrc
          NAPI_PREPUBLISH_FLAGS="--no-gh-release" \
            npm publish --registry=https://registry.npmjs.org/ --access public --tag "$DIST_TAG"

      # Everything below (mirror + docs sync) runs only on stable vX.Y.Z
      # tags; pre-releases skip it.
      - name: Classify release tag
        id: reltag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      # Mirror the release tree to the public simular-ai/simulang-js repo and
      # tag it — the docs' source links point at that tag (typedoc.mintlify.mjs).
      - name: Check out public mirror (simular-ai/simulang-js)
        if: steps.reltag.outputs.stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simular-ai/simulang-js
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: public-mirror
          ref: main

      - name: Sync public mirror and tag release
        if: steps.reltag.outputs.stable == 'true'
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # Squash snapshot: replace the mirror's tree wholesale, no internal history.
          find public-mirror -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/release-tree/." public-mirror/
          cd public-mirror
          git add -A
          if git diff --cached --quiet; then
            echo "Public mirror already matches this release tree."
          else
            git -c user.name=simulang-js-bot -c user.email=no-reply@simular.ai \
              commit -m "Sync public bindings to ${TAG_NAME}"
            git push origin HEAD:main
          fi
          # Force-tag for idempotent re-runs of the same release.
          git tag -f "$TAG_NAME"
          git push -f origin "refs/tags/${TAG_NAME}"

      # Generate the TypeDoc JSON artifact and PR it to simular-ai/docs,
      # where Mintlify renders the reference pages from it.
      - name: Generate Mintlify docs
        if: steps.reltag.outputs.stable == 'true'
        run: npm run docs:mintlify

      - name: Check out simular-ai/docs
        if: steps.reltag.outputs.stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simular-ai/docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo
          ref: main

      - name: Sync API docs to Mintlify
        if: steps.reltag.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: node scripts/sync-mintlify.mjs
