
[package]
authors = ["Robin Grell <robin@simular.ai>"]
edition = "2024"
license = "MIT"
name    = "simulang_js"
publish = false
version = "0.0.3"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "3.9.0", features = ["serde-json"] }
napi-derive = "3.5.6"

env_filter = "2.0"
log = "0.4"
parking_lot = "0.13"
serde_json = "1"
simulang-rs = { git = "ssh://git@github.com/simular-ai/simulang-rs-internal", tag = "v0.7.1-rc15", features = [
  "platform-specific",
] }
url = "2.5.4"

[build-dependencies]
napi-build = "2"

[profile.release]
strip = true
# Keep default panic = "unwind". Every exported function is
# `#[napi(catch_unwind)]` (checked by __test__/catchUnwind.spec.ts), which
# turns a Rust panic into a JavaScript error. With "abort", any panic would
# crash the Node process instead.

# What we publish (`npm run build:dist`, CI on release tags). Fat LTO over one
# codegen unit shrinks the addon from 11 MB to 8.4 MB, but re-optimizes every
# crate on each build: rebuilding this crate takes 66 s instead of 7 s.
[profile.dist]
codegen-units = 1
inherits      = "release"
lto           = "fat"
